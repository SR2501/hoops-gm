[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hoops-gm-backend"
version = "0.1.0"
description = "hoops-gm backend: FastAPI service, persistence and REST/SSE contracts"
readme = "README.md"
# Raised from ">=3.11" in Phase 2.
#
# **The original justification for this was wrong**, and is corrected here
# rather than quietly deleted: it claimed the `ingest` extra could not install
# on 3.11 because numpy 2.5 requires 3.12. numpy's pin in `nba_api` is
# version-gated (`numpy>=1.26 ; python_version < "3.13"`), so pip would have
# resolved an older numpy on 3.11 perfectly well. Caught in review.
#
# The real reasons, both checkable: the package now uses PEP 695 type-parameter
# syntax (`def portable_enum[E: enum.Enum]`), which is 3.12+ only; and CI has
# only ever run 3.12 while local development is on 3.14, so 3.11 support was
# never a tested claim to begin with.
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # Starlette's TestClient prefers httpx2; with httpx it emits a deprecation
    # warning, which the error-on-warning policy below turns into a failure.
    "httpx2>=2.10",
    "mypy>=1.13",
    "ruff>=0.8",
    # The adapter and identity tests exercise real client code, so the ingest
    # dependencies are needed to run the suite.
    "hoops-gm-backend[ingest]",
]
# Phase 2. **Pinned exactly, on purpose.**
#
# `fantraxapi` wraps /fxpa/req, undocumented internal Fantrax infrastructure,
# and `nba_api` wraps stats.nba.com, which deprecates endpoints mid-season. A
# floating version means an upstream behaviour change arrives as a mysterious
# difference in a number rather than as a deliberate upgrade with a contract
# test to run against it.
#
# Note that the plan's suggested fantraxapi 0.3.0 does not exist on PyPI — the
# published versions go 0.2.9 -> 1.0.0, and 1.0.x has a different API surface
# from the 0.2.x line most online examples use.
ingest = [
    "nba_api==1.11.4",
    "fantraxapi==1.0.1",
    # Fernet, for the Fantrax session cookie at rest.
    "cryptography>=44",
]
# ADR-001's destination. Declared so CI can run the whole suite against a real
# Postgres — without a driver, every portability claim is static analysis of
# metadata, and the three divergences that actually bit (enum CHECKs, dropped
# timezone offsets, '%' in a connection URL) only appear when a value or a
# connection crosses the seam.
postgres = [
    "psycopg[binary]>=3.2",
]

[project.scripts]
hoops-gm = "hoops_gm.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hoops_gm"]

# --- Lint -------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # comprehensions
    "TID",  # tidy imports
    "RUF",
]
ignore = [
    "B008",  # FastAPI dependency injection relies on calls in defaults
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["hoops_gm"]

# --- Types ------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
# Alembic migration scripts are generated and intentionally untyped.
exclude = "^alembic/"

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

# Third-party ingestion libraries ship no usable type information. `nba_api` in
# particular returns bare dicts from every endpoint, which is why the parsers
# in hoops_gm.ingest are written against `Any` and validate structure
# explicitly rather than trusting a type.
#
# `follow_imports = "skip"`, not merely `ignore_missing_imports`: nba_api pulls
# in pandas, which pulls in numpy, whose bundled stubs are only valid for the
# Python version numpy itself requires. Type-checking a dependency we do not
# control buys nothing here — the parsers deliberately treat every payload as
# `Any` and validate its structure explicitly, because a type from an untyped
# upstream is a claim nobody checked.
[[tool.mypy.overrides]]
module = [
    # Both the bare name and the wildcard: in mypy, `numpy.*` matches
    # submodules but not `numpy` itself, and the offending stub is
    # numpy/__init__.pyi.
    "nba_api",
    "nba_api.*",
    "fantraxapi",
    "fantraxapi.*",
    "requests",
    "requests.*",
    "pandas",
    "pandas.*",
    "numpy",
    "numpy.*",
]
ignore_missing_imports = true
follow_imports = "skip"

# --- Tests ------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    # Code gate: the default suite. Everything unmarked runs on every push.
    "sqlite_only: behaviour specific to the development database; skipped when TEST_DATABASE_URL is set",
    #
    # Extension points for the later gates (docs/governance/gates.md). These are
    # registered now and wired into CI now, so that when Phase 2 and Phase 4
    # land there is nothing to remember.
    "adapter_contract: offline contract test asserting a parser still matches a recorded fixture (Adapter gate)",
    "live_smoke: hits a real external source; allowed to fail, must fail loudly (Adapter gate)",
    "model_backtest: held-out backtest reporting calibration for a decision-bearing number (Model gate)",
]
filterwarnings = ["error"]
