[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
# sqlalchemy.url is intentionally absent. env.py reads DATABASE_URL through the
# application settings so that the migration and the app can never disagree
# about which database they are pointed at.

[post_write_hooks]
# Deliberately empty. Autogenerated migrations are formatted by running
# `ruff format` as part of the normal Code gate, rather than through an
# Alembic hook that has to resolve an entry point at generation time.
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
