name: "Copilot Setup Steps"

# Runs before the cloud agent starts work, so it does not have to discover and
# install the toolchain by trial and error. Without this the agent cold-installs
# Python, compiled wheels, Node and the frontend packages on every task, with no
# visible progress while it does — which looks exactly like a hung agent.
#
# This file has no effect until it is on the default branch.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be named `copilot-setup-steps` or Copilot will not pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      # Match ci.yml exactly. If these drift apart, the agent validates against a
      # different toolchain than CI does, and "works for the agent, fails in CI"
      # becomes a recurring and confusing class of failure.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Fail loudly here rather than leaving the agent to discover a broken
      # environment mid-task and work around it silently.
      - name: Verify the toolchain actually works
        run: |
          set -e
          cd backend
          python -c "import hoops_gm; print('backend importable')"
          ruff --version
          mypy --version
          alembic upgrade head
          alembic downgrade base
          cd ../frontend
          npx tsc --version
          echo "toolchain verified"
