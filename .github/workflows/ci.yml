# Code gate (docs/governance/gates.md).
#
# "Lint clean, type-check clean, tests green, no secrets committed" — applies
# to all code, enforced here.
#
# The Adapter and Model gates arrive with Phase 2 and Phase 4. Their jobs are
# already wired below and already running: they select pytest markers that
# currently match nothing, so the day a contract test or a backtest lands, it
# is enforced without anyone remembering to come back here.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # Nightly, for the live smoke job below. Scheduled runs only ever fire on the
  # default branch, which is what you want for upstream drift: the question is
  # "did an external source change under main overnight", not "does this PR
  # work". The Code gate jobs run too, which is a small cost and a real canary
  # — a dependency that breaks without any commit shows up here.
  schedule:
    - cron: '0 9 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  # --- Code gate ------------------------------------------------------------

  backend:
    name: Backend — lint, type-check, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      # `scripts/` is not under `backend/`, so neither step above has ever seen
      # it. `backend/pyproject.toml` type-checks it deliberately
      # (`files = ["src", "tests", "../scripts"]`) but nothing linted it, which
      # left the repository's own defect-catching tools outside the gate that
      # evidence is for.
      #
      # `working-directory` is overridden to the repo root rather than reaching
      # up with `../scripts`, so the repo-root `ruff.toml` is the configuration
      # in force by ancestry rather than by ruff's fallback to the cwd's config.
      # A gate quoted without its working directory is the defect this step
      # closes; running it from an implicit one would reintroduce it.
      - name: Lint and format-check scripts/
        working-directory: ${{ github.workspace }}
        run: |
          ruff check scripts
          ruff format --check scripts

      - name: Type-check
        run: mypy

      - name: Tests
        # --junitxml feeds the run-metrics steps below. pytest writes it as a
        # side effect of the run it was already doing, so the Code gate's own
        # timing is unchanged.
        run: pytest --junitxml=junit.xml

      - name: Recorded OpenAPI matches the served contract
        working-directory: ${{ github.workspace }}
        run: python scripts/capture_openapi.py --check

      # --- Per-run numbers, printed against their baseline ------------------
      #
      # See scripts/run_metrics.py. Print the delta, never judge it: there is
      # no budget here and no red build for a number that grew.
      #
      # Deliberately no continue-on-error, for the same reason live-smoke has
      # none. These steps have exactly one failure mode — the collector parsed
      # zero test cases, meaning the reporter's format changed underneath it —
      # and painting that green would leave a metrics job publishing an empty
      # table for months. A slow test cannot fail them; a broken collector can,
      # and should.
      - name: Restore metrics baseline
        uses: actions/cache/restore@v4
        with:
          path: backend/metrics-baseline
          key: run-metrics-backend-${{ github.sha }}
          restore-keys: run-metrics-backend-

      - name: Collect run metrics
        run: >-
          python ../scripts/run_metrics.py collect --label backend
          --junit junit.xml --out run-metrics/metrics.json

      - name: Print each number against its baseline
        run: >-
          python ../scripts/run_metrics.py report
          --current run-metrics/metrics.json
          --baseline metrics-baseline/metrics.json
          --summary "$GITHUB_STEP_SUMMARY"

      # Saved only on the default branch, so every branch compares against
      # main rather than against its own previous run. The climb that motivated
      # this unit was 3,177 -> 3,309 -> 3,376 -> 3,714 -> 4,298 ms across one
      # branch's runs: as run-to-run deltas that reads +132, +67, +338, +584,
      # four unremarkable numbers. Against a fixed baseline it accumulates into
      # a single +1,121.
      - name: Stage the new baseline
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          mkdir -p metrics-baseline
          cp run-metrics/metrics.json metrics-baseline/metrics.json

      - name: Save metrics baseline
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v4
        with:
          path: backend/metrics-baseline
          key: run-metrics-backend-${{ github.sha }}

  backlog-graph:
    name: Code gate — every backlog dependency resolves
    runs-on: ubuntu-latest
    # No dependencies to install: the script is stdlib-only, like
    # check_no_secrets.py, so it cannot rot when a package moves.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Fails on an edge naming an item that does not exist, a cycle, a
      # self-edge, a duplicated slug, an item with no status, a heading it
      # cannot read, and a `done` item resting on an unfinished one. It never
      # fails on the *shape* of the remaining work — path lengths and the ready
      # set are printed, because no honest edit to the backlog shortens a chain
      # and the only changes that would turn such a job green are deleting an
      # edge or misreporting a status.
      #
      # --summary, not stdout alone: a number printed in a green job's log is
      # read about as often as the vitest slow-test line was.
      - run: python scripts/backlog_graph.py --summary "$GITHUB_STEP_SUMMARY"

  migrations:
    name: Backend — migrations apply from empty
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Upgrade from empty
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
        run: alembic upgrade head

      # Fails when a model changed without a migration behind it. That drift is
      # invisible until a query hits a column the database does not have, which
      # on a local-first tool means mid-season.
      - name: Models and migrations agree
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
        run: alembic check

      - name: Downgrade to base
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
        run: alembic downgrade base

  postgres:
    name: Backend — the same suite against Postgres (ADR-001)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # This job is the one that turns ADR-001 from an assertion into something
    # enforced. Every check in test_portability.py is static analysis of
    # metadata, and the three divergences that actually bit — enum columns with
    # no CHECK, DateTime(timezone=True) silently dropping the offset on SQLite,
    # and '%' in a connection URL — are invisible to all of them, because they
    # only appear when a value or a connection really crosses the seam.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hoops
          # Contains '%' and '#' on purpose: a URL-encoded password is the
          # normal case, and it used to crash `alembic upgrade head`.
          POSTGRES_PASSWORD: 'ho%ops#pw'
          POSTGRES_DB: hoops_gm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hoops -d hoops_gm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://hoops:ho%25ops%23pw@127.0.0.1:5432/hoops_gm_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev,postgres]"

      - name: Migrations apply from empty on Postgres
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: alembic upgrade head

      - name: Models and migrations agree on Postgres
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: alembic check

      - name: Downgrade to base on Postgres
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: alembic downgrade base

      - name: Full suite against Postgres
        run: pytest

  frontend:
    name: Frontend — lint, type-check, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # The two JavaScript files in `scripts/` — `browser_probe.mjs` and
      # `reliability_probe.js` — sit outside every project in this repository
      # and so were covered by no gate at all: not this job, which lints
      # `frontend/`, and not the backend job, whose tools are Python.
      #
      # Run from `scripts/` rather than as `../scripts` from here, because
      # ESLint's flat config resolves `files` patterns relative to the config's
      # base directory; run from `frontend/`, the targets sit outside it.
      # `scripts/eslint.config.js` imports nothing, so it needs no install of
      # its own and borrows this job's binary.
      - name: Lint scripts/ JavaScript
        working-directory: ${{ github.workspace }}/scripts
        run: ../frontend/node_modules/.bin/eslint .

      - name: Type-check
        run: npm run typecheck

      - name: Tests
        # Two reporters: `default` keeps the console output a human reads when
        # a test fails, `json` writes the per-test durations the metrics steps
        # below diff against main. Dropping `default` here would trade a
        # readable failure for a number, which is a bad trade.
        run: npm test -- --reporter=default --reporter=json --outputFile.json=vitest-report.json

      # --- Per-run numbers, printed against their baseline ------------------
      #
      # This is the suite the motivating climb happened in: a single test went
      # 3,177 -> 3,309 -> 3,376 -> 3,714 -> 4,298 ms across consecutive runs
      # into vitest's 5,000 ms default timeout. Every value was printed, every
      # value was unremarkable, and nothing computed the difference.
      #
      # No continue-on-error, and no threshold. See the backend job.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore metrics baseline
        uses: actions/cache/restore@v4
        with:
          path: frontend/metrics-baseline
          key: run-metrics-frontend-${{ github.sha }}
          restore-keys: run-metrics-frontend-

      - name: Collect run metrics
        run: >-
          python ../scripts/run_metrics.py collect --label frontend
          --vitest vitest-report.json --out run-metrics/metrics.json

      - name: Print each number against its baseline
        run: >-
          python ../scripts/run_metrics.py report
          --current run-metrics/metrics.json
          --baseline metrics-baseline/metrics.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Stage the new baseline
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          mkdir -p metrics-baseline
          cp run-metrics/metrics.json metrics-baseline/metrics.json

      - name: Save metrics baseline
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v4
        with:
          path: frontend/metrics-baseline
          key: run-metrics-frontend-${{ github.sha }}

      - name: Build
        run: npm run build

  userscript:
    name: Userscript — tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: userscript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: userscript/package-lock.json

      - name: Install
        run: npm ci

      - name: Tests
        # Includes build.test.js, which runs the real build.mjs and checks
        # its output: @version tracks package.json, @updateURL/@downloadURL
        # are both present and loopback-only, and no secret-shaped literal
        # (ADR-010) is ever baked into the built file.
        run: npm test

      - name: Build
        run: npm run build

  secrets:
    name: Code gate — no secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python scripts/check_no_secrets.py

  doc-terminators:
    name: Code gate — the append-only docs end with a newline
    runs-on: ubuntu-latest
    # Stdlib-only, like check_no_secrets.py and backlog_graph.py, so it cannot
    # rot when a package moves.
    #
    # Its own job rather than a step inside `secrets` or `backlog-graph`,
    # because a job named for one check that silently performs another is the
    # shape this repository keeps filing defects about.
    #
    # **Why this is a gate.** `predict_union.py` counts dated entries with
    # `^## \d{4}-\d{2}-\d{2}`, anchored at a line start. Appending to a file
    # that does not end with a newline welds the heading onto the last line, so
    # the entry is present, uncounted, and unremarkable in a diff. It happened
    # twice on 2026-08-26; the first was healed incidentally by the next merge
    # and filed as self-healing, which was true of the instance and false of the
    # class.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python scripts/check_doc_terminators.py

  # --- Adapter gate (Phase 2 onwards) ---------------------------------------
  #
  # Contract tests run offline against committed fixtures and block a merge.
  # The live smoke test hits the real source and is allowed to fail — but
  # loudly and visibly, never silently. That asymmetry is the whole point:
  # /fxpa/req is undocumented internal infrastructure and stats.nba.com is
  # unstable, and we want to find out here rather than at lineup lock.

  adapter-gate:
    name: Adapter gate — recorded-fixture contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Contract tests
        # Exit code 5 is "no tests collected", which is the correct state until
        # Phase 2 adds the first adapter.
        run: |
          set +e
          pytest -m adapter_contract
          status=$?
          set -e
          if [ $status -eq 5 ]; then
            echo "::notice::No adapter contract tests yet — expected until Phase 2."
            exit 0
          fi
          exit $status

  live-smoke:
    name: Adapter gate — live smoke (must fail loudly, cannot block a merge)
    runs-on: ubuntu-latest
    env:
      # Repository variable rather than source: the owner classifies leagueId
      # as non-secret, but it retrieves identity-bearing private-league data.
      HOOPS_GM_FANTRAX_LEAGUE_ID: ${{ vars.HOOPS_GM_FANTRAX_LEAGUE_ID }}
    # Never on push or pull_request: a third party's outage must not look like
    # a broken change. That is what stops this blocking a merge — structurally,
    # because it does not run on the events a merge depends on.
    #
    # Deliberately no continue-on-error. The Adapter gate says a live smoke
    # test is "allowed to fail without blocking a merge, but it must fail
    # loudly and visibly", and continue-on-error does the opposite: it paints
    # a real upstream break green on a nightly run nobody is watching. Let it
    # go red. Three of the project's findings so far — no NBA id in Fantrax
    # (R7), cdn.nba.com returning 403 (R26), stats.nba.com reachable only via
    # nba_api (R27) — were invisible until something executed against the real
    # source. This job is how that keeps happening after Phase 2.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Live smoke tests
        run: |
          set +e
          pytest -m live_smoke
          status=$?
          set -e
          if [ $status -eq 5 ]; then
            echo "::notice::No live smoke tests yet — expected until Phase 2."
            exit 0
          fi
          if [ $status -ne 0 ]; then
            echo "::error::Live smoke tests failed. An upstream has changed, is"\
                 "down, or is blocking this network. Check the recorded-fixture"\
                 "contract tests too: if those still pass, the parser is fine and"\
                 "the source is the problem."
          fi
          exit $status

  # --- Model gate (Phase 4 onwards) -----------------------------------------
  #
  # Backtests report calibration, not just accuracy. A model that says 70% and
  # is right 70% of the time is more useful for a lineup decision than a
  # higher-accuracy model that is overconfident. The gate also requires a model
  # card in docs/models/ and an explicit statement of what the model cannot
  # see; those are review obligations, not automatable ones.

  model-gate:
    name: Model gate — backtests report calibration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Backtests
        run: |
          set +e
          pytest -m model_backtest
          status=$?
          set -e
          if [ $status -eq 5 ]; then
            echo "::notice::No model backtests yet — expected until Phase 4."
            exit 0
          fi
          exit $status
